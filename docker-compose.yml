# =============================================================================
# Spring PetClinic Microservices - Docker Compose Configuration
# =============================================================================
#
# Architecture Overview:
#   - All services communicate via the "backend" Docker network
#   - External-facing services (nginx, api-gateway, admin, grafana) also join "frontend"
#   - Nginx reverse proxy is the single entry point on port 80
#   - Internal business services (customers, visits, vets, genai) have no host port exposure
#   - All services have health checks and restart policies for resilience
#
# Service Startup Order:
#   config-server → discovery-server → business services → api-gateway → nginx
#
# Access Points:
#   http://localhost        - PetClinic UI (via nginx → api-gateway)
#   http://localhost/grafana/  - Grafana dashboards
#   http://localhost/admin/    - Spring Boot Admin
#   http://localhost/eureka/   - Eureka service registry dashboard
#   http://localhost/zipkin/   - Distributed tracing UI
#   http://localhost:8761      - Eureka (direct)
#   http://localhost:8888      - Config Server (direct)
#   http://localhost:9090      - Admin Server (direct, requires /admin/ prefix)
#   http://localhost:9411      - Zipkin (direct)
#   http://localhost:3030      - Grafana (direct)
#   http://localhost:9091      - Prometheus (direct)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------

  # Centralized configuration server - must start first.
  # All other Spring services fetch their config from here on startup.
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
     - 8888:8888
    networks:
      - backend
    restart: unless-stopped

  # Eureka service registry - enables service-to-service discovery.
  # All microservices register here and look up other services by name.
  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Business Services
  # These services have no host port mappings - they are only reachable
  # within the Docker network via Eureka discovery and the API gateway.
  # Uncomment the ports sections below if direct access is needed for debugging.
  # ---------------------------------------------------------------------------

  # Manages pet owners and their pets.
  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    # ports:
    #   - 8081:8081  # Accessible via nginx reverse proxy
    networks:
      - backend
    restart: unless-stopped

  # Manages veterinary visit records.
  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    # ports:
    #   - 8082:8082  # Accessible via nginx reverse proxy
    networks:
      - backend
    restart: unless-stopped

  # Manages veterinarian profiles and specialties.
  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    # ports:
    #   - 8083:8083  # Accessible via nginx reverse proxy
    networks:
      - backend
    restart: unless-stopped

  # AI-powered chatbot service (requires OPENAI_API_KEY or Azure OpenAI credentials).
  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    # ports:
    #   - 8084:8084  # Accessible via nginx reverse proxy
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Edge & Gateway Services
  # ---------------------------------------------------------------------------

  # Spring Cloud Gateway - routes external requests to backend microservices.
  # Hosts the AngularJS frontend and proxies API calls to business services.
  # Waits for all business services to be healthy before starting.
  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customers-service:
        condition: service_healthy
      visits-service:
        condition: service_healthy
      vets-service:
        condition: service_healthy
    ports:
     - 8080:8080
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observability Services
  # ---------------------------------------------------------------------------

  # Zipkin distributed tracing - collects and visualizes request traces
  # across all microservices. Accessible at /zipkin/ via nginx.
  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
     - 9411:9411
    networks:
      - backend
    restart: unless-stopped

  # Spring Boot Admin - monitors and manages all Spring Boot services.
  # Configured with context-path=/admin for nginx sub-path proxying.
  # Direct access: http://localhost:9090/admin/
  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    environment:
      # Context path enables correct sub-path proxying via nginx at /admin/
      - SERVER_SERVLET_CONTEXT_PATH=/admin
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/admin/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090
    networks:
      - frontend
      - backend
    restart: unless-stopped

  ## Grafana / Prometheus

  # Grafana metrics dashboards - pre-configured with PetClinic dashboard.
  # Sub-path support enabled via grafana.ini (serve_from_sub_path=true).
  # Accessible at /grafana/ via nginx or directly at host port 3030.
  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
    - 3030:3000
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Prometheus metrics collector - scrapes /actuator/prometheus from all services.
  # Uses wget (Alpine-based image does not include curl).
  # Host port 9091 maps to container port 9090 to avoid conflict with admin-server.
  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
    - 9091:9090
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Reverse Proxy
  # ---------------------------------------------------------------------------

  # Nginx reverse proxy - single entry point for all web UIs on port 80.
  # Routes: / → api-gateway, /grafana/ → grafana, /admin/ → admin-server,
  #         /eureka/ → discovery-server, /zipkin/ → tracing-server.
  # Uses wget for health check (Alpine-based image).
  # Starts only after api-gateway is healthy (which depends on all business services).
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
# - frontend: Services that need external/browser access (nginx, api-gateway,
#             admin-server, grafana-server)
# - backend:  All services join this network for inter-service communication
#             via Eureka discovery and direct container-to-container networking
# =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
