worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name localhost;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $upstream http://api-gateway:8080;
            proxy_pass $upstream;
        }

        location /eureka/ {
            set $upstream http://discovery-server:8761;
            proxy_pass $upstream;
        }

        location /config/ {
            set $upstream http://config-server:8888;
            proxy_pass $upstream;
        }

        location /admin/ {
            set $upstream http://admin-server:9090;
            proxy_pass $upstream;
        }

        location /zipkin/ {
            set $upstream http://tracing-server:9411;
            proxy_pass $upstream;
        }

        location /grafana/ {
            set $upstream http://grafana-server:3000;
            proxy_pass $upstream;
        }

        location /prometheus/ {
            set $upstream http://prometheus-server:9090;
            proxy_pass $upstream;
        }
    }
}
