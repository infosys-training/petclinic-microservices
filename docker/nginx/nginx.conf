resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name localhost;

    # API Gateway (main application entry point)
    location / {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana dashboards
    location /grafana/ {
        set $upstream_grafana http://grafana-server:3000;
        proxy_pass $upstream_grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot Admin
    location /admin/ {
        set $upstream_admin http://admin-server:9090;
        proxy_pass $upstream_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eureka dashboard
    location /eureka/web {
        set $upstream_eureka http://discovery-server:8761;
        proxy_pass $upstream_eureka;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for the proxy itself
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
