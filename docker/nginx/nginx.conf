worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway (main application entry point)
        location / {
            set $upstream http://api-gateway:8080;
            proxy_pass $upstream;
        }

        # Eureka Discovery Server dashboard
        location /eureka/ {
            set $upstream http://discovery-server:8761;
            proxy_pass $upstream;
        }

        # Config Server
        location /config/ {
            set $upstream http://config-server:8888;
            proxy_pass $upstream;
            rewrite ^/config/(.*) /$1 break;
        }

        # Spring Boot Admin
        location /admin/ {
            set $upstream http://admin-server:9090;
            proxy_pass $upstream;
            rewrite ^/admin/(.*) /$1 break;
        }

        # Zipkin Tracing
        location /zipkin/ {
            set $upstream http://tracing-server:9411;
            proxy_pass $upstream;
        }

        # Grafana dashboards
        location /grafana/ {
            set $upstream http://grafana-server:3000;
            proxy_pass $upstream;
            rewrite ^/grafana/(.*) /$1 break;
        }

        # Prometheus UI
        location /prometheus/ {
            set $upstream http://prometheus-server:9090;
            proxy_pass $upstream;
            rewrite ^/prometheus/(.*) /$1 break;
        }
    }
}
