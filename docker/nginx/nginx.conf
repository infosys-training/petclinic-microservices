worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ---------- Rate Limiting ----------
    # General zone: 20 requests/sec per client IP, burst up to 40
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    # Stricter zone for API endpoints: 10 requests/sec per client IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Return 429 Too Many Requests when limit is exceeded
    limit_req_status 429;

    # Docker embedded DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;

    # ---------- HTTP → HTTPS Redirect ----------
    server {
        listen 80;
        server_name localhost;

        # Health check must remain on HTTP for Docker health probes
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS Server ----------
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Main application via API Gateway (stricter rate limit)
        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_gateway http://api-gateway:8080;
            proxy_pass $upstream_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Server
        location /admin/ {
            limit_req zone=general burst=40 nodelay;
            set $upstream_admin http://admin-server:9090/;
            proxy_pass $upstream_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana
        location /grafana/ {
            limit_req zone=general burst=40 nodelay;
            set $upstream_grafana http://grafana-server:3000/;
            proxy_pass $upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus
        location /prometheus/ {
            limit_req zone=general burst=40 nodelay;
            set $upstream_prometheus http://prometheus-server:9090/;
            proxy_pass $upstream_prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Eureka Discovery Server
        location /eureka/ {
            limit_req zone=general burst=40 nodelay;
            set $upstream_eureka http://discovery-server:8761/;
            proxy_pass $upstream_eureka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Zipkin Tracing Server
        location /zipkin/ {
            limit_req zone=general burst=40 nodelay;
            set $upstream_zipkin http://tracing-server:9411/zipkin/;
            proxy_pass $upstream_zipkin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
