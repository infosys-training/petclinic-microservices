worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Timeouts for proxied connections
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upstream definitions
    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream discovery-server {
        server discovery-server:8761;
    }

    upstream admin-server {
        server admin-server:9090;
    }

    upstream tracing-server {
        server tracing-server:9411;
    }

    upstream grafana-server {
        server grafana-server:3000;
    }

    upstream prometheus-server {
        server prometheus-server:9090;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway (main application)
        location / {
            proxy_pass http://api-gateway;
        }

        # Eureka Dashboard
        location /eureka/ {
            proxy_pass http://discovery-server/eureka/;
        }

        # Spring Boot Admin
        location /admin/ {
            proxy_pass http://admin-server/;
        }

        # Zipkin tracing
        location /zipkin/ {
            proxy_pass http://tracing-server/zipkin/;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana-server/;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus-server/;
        }

        # Health endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
