worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    server {
        listen 80;

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main application - API Gateway
        location / {
            set $upstream_gateway http://api-gateway:8080;
            proxy_pass $upstream_gateway;
        }

        # Eureka Discovery Server
        location /eureka/ {
            set $upstream_eureka http://discovery-server:8761;
            rewrite ^/eureka/(.*) /$1 break;
            proxy_pass $upstream_eureka;
        }

        # Config Server
        location /config/ {
            set $upstream_config http://config-server:8888;
            rewrite ^/config/(.*) /$1 break;
            proxy_pass $upstream_config;
        }

        # Spring Boot Admin
        location /admin/ {
            set $upstream_admin http://admin-server:9090;
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass $upstream_admin;
        }

        # Zipkin tracing (Zipkin natively serves from /zipkin)
        location /zipkin/ {
            set $upstream_zipkin http://tracing-server:9411;
            proxy_pass $upstream_zipkin;
        }

        # Grafana dashboards
        location /grafana/ {
            set $upstream_grafana http://grafana-server:3000;
            rewrite ^/grafana/(.*) /$1 break;
            proxy_pass $upstream_grafana;
        }

        # Prometheus UI
        location /prometheus/ {
            set $upstream_prometheus http://prometheus-server:9090;
            rewrite ^/prometheus/(.*) /$1 break;
            proxy_pass $upstream_prometheus;
        }
    }
}
