upstream api-gateway {
    server api-gateway:8080;
}

upstream eureka {
    server discovery-server:8761;
}

upstream admin {
    server admin-server:9090;
}

upstream grafana {
    server grafana-server:3000;
}

upstream tracing {
    server tracing-server:9411;
}

server {
    listen 80;
    server_name localhost;

    # Main application (API Gateway + UI)
    location / {
        proxy_pass http://api-gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eureka dashboard
    location /eureka/ {
        proxy_pass http://eureka/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin server dashboard
    location /admin/ {
        proxy_pass http://admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana dashboards
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zipkin tracing UI
    location /zipkin/ {
        proxy_pass http://tracing/zipkin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint for the proxy itself
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
