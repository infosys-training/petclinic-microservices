server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Main Application (API Gateway)
    location / {
        set $target_api_gateway http://api-gateway:8080;
        proxy_pass $target_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Spring Boot Admin
    location /admin/ {
        set $target_admin http://admin-server:9090;
        proxy_pass $target_admin/;
    }

    # Eureka Dashboard
    location /discovery/ {
        set $target_eureka http://discovery-server:8761;
        proxy_pass $target_eureka/;
    }

    # Zipkin Tracing
    location /zipkin/ {
        set $target_zipkin http://tracing-server:9411;
        proxy_pass $target_zipkin/zipkin/;
    }

    # Grafana Dashboards
    location /grafana/ {
        set $target_grafana http://grafana-server:3000;
        proxy_pass $target_grafana/;
    }

    # Prometheus Metrics
    location /prometheus/ {
        set $target_prometheus http://prometheus-server:9090;
        proxy_pass $target_prometheus/;
    }

    # Nginx health check endpoint
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
