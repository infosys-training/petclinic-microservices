worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Increase proxy timeouts for slow-starting Spring Boot services
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # Nginx health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway (main application)
        location / {
            set $upstream http://api-gateway:8080;
            proxy_pass $upstream;
        }

        # Eureka Discovery Server
        location /eureka/ {
            set $upstream http://discovery-server:8761;
            proxy_pass $upstream;
        }

        # Config Server
        location /config/ {
            set $upstream http://config-server:8888;
            proxy_pass $upstream;
            rewrite ^/config/(.*) /$1 break;
        }

        # Spring Boot Admin
        location /admin/ {
            set $upstream http://admin-server:9090;
            proxy_pass $upstream;
            rewrite ^/admin/(.*) /$1 break;
        }

        # Zipkin tracing
        location /zipkin/ {
            set $upstream http://tracing-server:9411;
            proxy_pass $upstream;
        }

        # Grafana dashboards
        location /grafana/ {
            set $upstream http://grafana-server:3000;
            proxy_pass $upstream;
            rewrite ^/grafana/(.*) /$1 break;
        }

        # Prometheus UI
        location /prometheus/ {
            set $upstream http://prometheus-server:9090;
            proxy_pass $upstream;
            rewrite ^/prometheus/(.*) /$1 break;
        }
    }
}
