worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for long-polling / SSE used by Spring Boot Admin
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream admin-server {
        server admin-server:9090;
    }

    upstream discovery-server {
        server discovery-server:8761;
    }

    upstream grafana-server {
        server grafana-server:3000;
    }

    upstream prometheus-server {
        server prometheus-server:9090;
    }

    upstream tracing-server {
        server tracing-server:9411;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway (main application UI and API)
        location / {
            proxy_pass http://api-gateway;
        }

        # Spring Boot Admin Server
        location /admin/ {
            proxy_pass http://admin-server/;
        }

        # Eureka Discovery Server dashboard
        location /eureka/ {
            proxy_pass http://discovery-server/;
        }

        # Grafana dashboards
        location /grafana/ {
            proxy_pass http://grafana-server/;
        }

        # Prometheus UI
        location /prometheus/ {
            proxy_pass http://prometheus-server/;
        }

        # Zipkin tracing UI
        location /zipkin/ {
            proxy_pass http://tracing-server/zipkin/;
        }

        # Health check endpoint for the reverse proxy itself
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
