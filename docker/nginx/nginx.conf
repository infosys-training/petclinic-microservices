worker_processes auto;

events {
    worker_connections 1024;
}

http {
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream discovery-server {
        server discovery-server:8761;
    }

    upstream admin-server {
        server admin-server:9090;
    }

    upstream tracing-server {
        server tracing-server:9411;
    }

    upstream grafana-server {
        server grafana-server:3000;
    }

    upstream prometheus-server {
        server prometheus-server:9090;
    }

    # Main entry point - API Gateway (port 80)
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Eureka Dashboard (port 8761)
    server {
        listen 8761;
        server_name localhost;

        location / {
            proxy_pass http://discovery-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Spring Boot Admin (port 9090)
    server {
        listen 9090;
        server_name localhost;

        location / {
            proxy_pass http://admin-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Zipkin Tracing (port 9411)
    server {
        listen 9411;
        server_name localhost;

        location / {
            proxy_pass http://tracing-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Grafana (port 3030)
    server {
        listen 3030;
        server_name localhost;

        location / {
            proxy_pass http://grafana-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Prometheus (port 9091)
    server {
        listen 9091;
        server_name localhost;

        location / {
            proxy_pass http://prometheus-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
