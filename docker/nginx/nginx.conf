# =============================================================================
# Nginx Reverse Proxy Configuration for Spring PetClinic Microservices
# =============================================================================
#
# This nginx instance acts as the single entry point (port 80) for all web UIs.
# It routes requests to the appropriate backend service based on URL path.
#
# Sub-path proxying strategy:
#   /           → api-gateway (PetClinic UI + REST APIs)
#   /grafana/   → grafana-server (native sub-path via grafana.ini)
#   /admin/     → admin-server (Spring Boot context-path=/admin)
#   /eureka/    → discovery-server (sub_filter rewrites absolute paths in HTML)
#   /zipkin/    → tracing-server (Zipkin natively supports sub-path)
#
# Notes:
#   - Eureka cannot use context-path because it would break the /eureka/ service
#     discovery API endpoint that all microservices register against. Instead,
#     we use sub_filter to rewrite absolute HTML paths (href="/", src="/", etc.)
#   - Accept-Encoding is cleared for Eureka so nginx can inspect response bodies
#     for sub_filter replacement (compressed responses can't be filtered).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream definitions for each backend service
    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream grafana {
        server grafana-server:3000;
    }

    upstream admin {
        server admin-server:9090;
    }

    upstream discovery {
        server discovery-server:8761;
    }

    upstream tracing {
        server tracing-server:9411;
    }

    server {
        listen 80;
        server_name localhost;

        # Main app (API Gateway) - serves PetClinic UI and proxies REST API calls
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana dashboard - sub-path support enabled natively in grafana.ini
        # (serve_from_sub_path=true, root_url includes /grafana/)
        location /grafana/ {
            proxy_pass http://grafana/grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Spring Boot Admin - context-path set to /admin via SERVER_SERVLET_CONTEXT_PATH
        # env var in docker-compose.yml, so the app natively serves from /admin/
        location /admin/ {
            proxy_pass http://admin/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Eureka dashboard - uses sub_filter to rewrite absolute paths in HTML responses.
        # Eureka serves its dashboard at / with some absolute links (href="/", etc.).
        # sub_filter rewrites these to include the /eureka/ prefix so navigation works.
        # Accept-Encoding is cleared to prevent gzip (sub_filter needs plain text).
        location /eureka/ {
            proxy_pass http://discovery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";

            # Rewrite absolute paths in HTML to include /eureka/ prefix
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/eureka/';
            sub_filter 'src="/' 'src="/eureka/';
            sub_filter 'action="/' 'action="/eureka/';
        }

        # Zipkin tracing UI - natively supports being served under /zipkin/ sub-path
        location /zipkin/ {
            proxy_pass http://tracing/zipkin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
