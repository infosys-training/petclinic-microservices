worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream definitions
    upstream api-gateway {
        server api-gateway:8080;
    }

    # Main server block - routes all traffic
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # API Gateway (main application)
        #
        # Note: Grafana, Prometheus, Zipkin, Spring Boot Admin, and Eureka are
        # intentionally NOT proxied through sub-paths here. Those applications
        # would need to be configured (root_url / --web.external-url /
        # ZIPKIN_UI_BASEPATH / server.servlet.context-path) to generate URLs
        # under a sub-path. Until that is set up, access them directly on
        # their published ports (3030, 9091, 9411, 9090, 8761).
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
