worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream for the Spring Cloud API Gateway
    upstream api-gateway {
        server api-gateway:8080;
    }

    # Upstream for Eureka dashboard (optional dev access)
    upstream discovery-server {
        server discovery-server:8761;
    }

    server {
        listen 80;
        server_name localhost;

        # Main application - proxy to API Gateway
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts - Spring Boot services can be slow to respond initially
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Eureka dashboard access via /eureka-dashboard/
        location /eureka-dashboard/ {
            proxy_pass http://discovery-server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoint for the proxy itself
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
