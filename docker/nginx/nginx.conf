worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    # Timeouts for upstream Spring services (they can be slow to start)
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    90s;

    # Shared proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # Main app → API Gateway
        location / {
            proxy_pass http://api-gateway:8080;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana-server:3000/;
        }

        # Spring Boot Admin
        location /admin/ {
            proxy_pass http://admin-server:9090/;
        }

        # Zipkin tracing UI
        location /zipkin/ {
            proxy_pass http://tracing-server:9411/zipkin/;
        }

        # Eureka dashboard (useful for debugging)
        location /eureka/ {
            proxy_pass http://discovery-server:8761/;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus-server:9090/;
        }

        # Health endpoint for the proxy itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
