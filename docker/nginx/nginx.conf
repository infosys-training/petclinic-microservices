worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream api-gateway {
        server api-gateway:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Main application — proxy to Spring Cloud Gateway
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Eureka dashboard
        location /eureka/ {
            proxy_pass http://discovery-server:8761/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Spring Boot Admin
        location /admin/ {
            proxy_pass http://admin-server:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Zipkin tracing UI
        location /zipkin/ {
            proxy_pass http://tracing-server:9411/zipkin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana-server:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
