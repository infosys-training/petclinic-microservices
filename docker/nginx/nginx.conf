worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream grafana {
        server grafana-server:3000;
    }

    upstream admin {
        server admin-server:9090;
    }

    upstream discovery {
        server discovery-server:8761;
    }

    upstream tracing {
        server tracing-server:9411;
    }

    server {
        listen 80;
        server_name localhost;

        # Main app (API Gateway)
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Spring Boot Admin
        location /admin/ {
            proxy_pass http://admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Eureka dashboard
        location /eureka/ {
            proxy_pass http://discovery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Zipkin tracing
        location /zipkin/ {
            proxy_pass http://tracing/zipkin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
