worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Timeouts tuned for slow-starting Spring Boot services behind Eureka
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Use Docker embedded DNS so upstream names resolve at request time,
    # allowing NGINX to start even if backends are not yet healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Common proxy headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # ---------- Primary application (API Gateway / UI) ----------
        location / {
            set $upstream_api_gateway http://api-gateway:8080;
            proxy_pass $upstream_api_gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }

        # ---------- Infrastructure dashboards ----------
        location /eureka/ {
            set $upstream_discovery http://discovery-server:8761;
            proxy_pass $upstream_discovery/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /config/ {
            set $upstream_config http://config-server:8888;
            proxy_pass $upstream_config/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $upstream_admin http://admin-server:9090;
            proxy_pass $upstream_admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /zipkin/ {
            set $upstream_tracing http://tracing-server:9411;
            proxy_pass $upstream_tracing/zipkin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana/ {
            set $upstream_grafana http://grafana-server:3000;
            proxy_pass $upstream_grafana/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /prometheus/ {
            set $upstream_prometheus http://prometheus-server:9090;
            proxy_pass $upstream_prometheus/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Health endpoint for the proxy itself ----------
        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
