worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for Spring Boot Admin
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main application - API Gateway
        location / {
            set $upstream http://api-gateway:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Eureka Discovery Server
        location /eureka/ {
            set $upstream http://discovery-server:8761;
            proxy_pass $upstream/;
        }

        # Config Server
        location /config/ {
            set $upstream http://config-server:8888;
            proxy_pass $upstream/;
        }

        # Spring Boot Admin
        location /admin/ {
            set $upstream http://admin-server:9090;
            proxy_pass $upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Zipkin Tracing
        location /zipkin/ {
            set $upstream http://tracing-server:9411;
            proxy_pass $upstream/zipkin/;
        }

        # Grafana
        location /grafana/ {
            set $upstream http://grafana-server:3000;
            proxy_pass $upstream/;
            proxy_set_header X-Forwarded-Prefix /grafana;
        }

        # Prometheus
        location /prometheus/ {
            set $upstream http://prometheus-server:9090;
            proxy_pass $upstream/;
        }
    }
}
