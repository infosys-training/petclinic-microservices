worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream api-gateway {
        server api-gateway:8080;
    }

    upstream grafana {
        server grafana-server:3000;
    }

    upstream admin {
        server admin-server:9090;
    }

    upstream discovery {
        server discovery-server:8761;
    }

    upstream tracing {
        server tracing-server:9411;
    }

    server {
        listen 80;
        server_name localhost;

        # Main app (API Gateway)
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana dashboard (native sub-path support via grafana.ini)
        location /grafana/ {
            proxy_pass http://grafana/grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Spring Boot Admin (context-path set to /admin)
        location /admin/ {
            proxy_pass http://admin/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Eureka dashboard (uses sub_filter to rewrite absolute paths)
        location /eureka/ {
            proxy_pass http://discovery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/eureka/';
            sub_filter 'src="/' 'src="/eureka/';
            sub_filter 'action="/' 'action="/eureka/';
        }

        # Zipkin tracing (natively supports sub-path)
        location /zipkin/ {
            proxy_pass http://tracing/zipkin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
