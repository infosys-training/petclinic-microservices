worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver for service discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # API Gateway (main application entry point)
        location / {
            set $upstream_gateway http://api-gateway:8080;
            proxy_pass $upstream_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Eureka Discovery Server
        location /eureka/ {
            set $upstream_eureka http://discovery-server:8761;
            rewrite ^/eureka/(.*) /$1 break;
            proxy_pass $upstream_eureka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Config Server
        location /config/ {
            set $upstream_config http://config-server:8888;
            rewrite ^/config/(.*) /$1 break;
            proxy_pass $upstream_config;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spring Boot Admin Server
        location /admin/ {
            set $upstream_admin http://admin-server:9090;
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass $upstream_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Zipkin Tracing Server (Zipkin expects the /zipkin/ prefix)
        location /zipkin/ {
            set $upstream_zipkin http://tracing-server:9411;
            proxy_pass $upstream_zipkin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana
        location /grafana/ {
            set $upstream_grafana http://grafana-server:3000;
            rewrite ^/grafana/(.*) /$1 break;
            proxy_pass $upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus
        location /prometheus/ {
            set $upstream_prometheus http://prometheus-server:9090;
            rewrite ^/prometheus/(.*) /$1 break;
            proxy_pass $upstream_prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nginx health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
