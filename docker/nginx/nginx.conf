worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for slow-starting Spring Boot services
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    server {
        listen 80;
        server_name _;

        # Health check endpoint for the reverse proxy itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main app (API Gateway)
        location / {
            set $upstream_gateway http://api-gateway:8080;
            proxy_pass $upstream_gateway;
        }

        # Eureka Discovery Server
        location /eureka/ {
            set $upstream_eureka http://discovery-server:8761;
            proxy_pass $upstream_eureka/;
        }

        # Config Server
        location /config/ {
            set $upstream_config http://config-server:8888;
            proxy_pass $upstream_config/;
        }

        # Spring Boot Admin Server
        location /admin/ {
            set $upstream_admin http://admin-server:9090;
            proxy_pass $upstream_admin/;
        }

        # Zipkin Tracing Server
        location /zipkin/ {
            set $upstream_zipkin http://tracing-server:9411;
            proxy_pass $upstream_zipkin/zipkin/;
        }

        # Grafana Dashboards
        location /grafana/ {
            set $upstream_grafana http://grafana-server:3000;
            proxy_pass $upstream_grafana/;
            proxy_set_header Host $host;
        }

        # Prometheus UI
        location /prometheus/ {
            set $upstream_prometheus http://prometheus-server:9090;
            proxy_pass $upstream_prometheus/;
        }
    }
}
