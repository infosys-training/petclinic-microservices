apiVersion: v1
kind: Secret
metadata:
  name: genai-secrets
  namespace: spring-petclinic
  labels:
    app: genai-service
type: Opaque
stringData:
  openai-api-key: "demo"
  # azure-openai-key: ""
  # azure-openai-endpoint: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: spring-petclinic
  labels:
    app: genai-service
    app.kubernetes.io/part-of: spring-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      initContainers:
        - name: wait-for-discovery
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health | grep -q UP; do echo "Waiting for discovery-server..."; sleep 5; done']
      containers:
        - name: genai-service
          image: springcommunity/spring-petclinic-genai-service
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: genai-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: spring-petclinic
  labels:
    app: genai-service
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
  selector:
    app: genai-service
